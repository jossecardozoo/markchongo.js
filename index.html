<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <link href="css/bootstrap.flatty.min.css?v=20260331-3" rel="stylesheet">
    <link href="css/bib-publication-list.css?v=20260331-3" rel="stylesheet"/>
    <link href="index.css?v=20260401-8" rel="stylesheet">

    <script src="config.js"></script>
</head>

<body>

<nav class="navbar navbar-default navbar-fixed-top" role="banner">
  <div class="container">
    <div class="navbar-header">
      <button class="navbar-toggle" type="button" data-toggle="collapse" data-target=".navbar-collapse">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a href="/" class="navbar-brand"></a>
    </div>
  </div>
</nav>

<div id="masthead">
  <div class="container">
    <div class="row">
      <div class="col-md-7">
        <h1><span id="title-page"></span>
          <p id="sub-title-page" class="lead"></p>
        </h1>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="container">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3 sidebar-container"></div>

        <!-- CONTENT -->
        <div class="col-md-9">

            <div class="main-container"></div>

            <div id="bibtex-container">

                <div class="bibtex_template" style="display:none;">
                    <div class="if year"><span class="year"></span></div>
                    <div class="if type"><span class="type"></span></div>
                    <div class="if title"><span class="title"></span></div>
                    <div class="if author"><span class="author"></span></div>
                    <div class="if journal"><span class="journal"></span></div>
                </div>

                <div class="bibtex_search">
                    Search: <input type="text" class="bibtex_search_input">
                </div>

            </div>

        </div>
    </div>
</div>

<div class="modalLoading"></div>

<!-- SCRIPTS -->
<script src="js/jquery-2.1.4.min.js?v=20260331-3"></script>
<script src="js/bootstrap.min.js?v=20260331-3"></script>
<script src="js/scripts.js?v=20260331-3"></script>
<script src="js/marked.js?v=20260331-3"></script>
<script src="js/content-formatting.js?v=20260401-2"></script>
<script src="js/markchongo.js?v=20260401-3"></script>
<script src="js/bib-list.js?v=20260331-3"></script>

</body>
</html>
